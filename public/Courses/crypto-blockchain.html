<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/CSS/main.css" />
    <title>Course Template</title>
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="/">Babes4Trades</a>
</nav>

<!-- MAIN -->
<main class="container my-4">
  <div class="row">
    <!-- 📚 Module Sidebar (smaller, left) -->
    <div class="col-12 col-lg-3 mb-3 mb-lg-0">
      <div class="card h-100 shadow-sm">
        <div class="card-header">
          <strong>Modules</strong>
        </div>
        <ul class="list-group list-group-flush small" id="moduleList">
          <!-- Example items; hook these to JS later -->
          <li class="list-group-item d-flex justify-content-between align-items-center active">
            <span>1. Intro to Finance</span>
            <span class="badge bg-success">Now</span>
          </li>
          <li class="list-group-item">
            2. Understanding Cash Flow
          </li>
          <li class="list-group-item">
            3. Assets, Liabilities & Equity
          </li>
          <li class="list-group-item">
            4. Income Statements
          </li>
          <li class="list-group-item">
            5. Balance Sheet Walkthrough
          </li>
        </ul>
      </div>
    </div>

    <!-- 🎥 Main Video Area (right) -->
    <div class="col-12 col-lg-9">
      <!-- Title + progress -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 id="videoTitle" class="m-0">Loading...</h3>
        <div class="small text-muted" id="progressBadge"></div>
      </div>

      <!-- Player (16:9 wrapper) -->
      <div class="position-relative mb-2" style="padding-top: 56.25%;">
        <iframe id="bunnyPlayer"
          src=""
          loading="lazy"
          style="border:0; position:absolute; top:0; left:0; width:100%; height:100%;"
          allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture;"
          allowfullscreen="true">
        </iframe>

        <!-- Prev / Next -->
        <button id="prevBtn"
          class="btn btn-outline-light position-absolute top-50 start-0 translate-middle-y ms-2">
          ‹ Prev
        </button>
        <button id="nextBtn"
          class="btn btn-outline-light position-absolute top-50 end-0 translate-middle-y me-2">
          Next ›
        </button>
      </div>

      <div class="mt-3 d-flex justify-content-between align-items-center">
        <span id="videoIndexLabel" class="text-muted"></span>
        <button id="markCompleteBtn" class="btn btn-success">Mark as Complete</button>
      </div>
    </div>
  </div>
</main>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/JS/main.js"></script>
</body>
</html>
